name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
       - uses: actions/checkout@v4

       - name: authenticate to Google Cloud
         uses: google-github-actions/auth@v3
         with:
           credentials_json: ${{ secrets.GCP_SA_KEY }}

       - name: Set up Cloud SDK
         uses: google-github-actions/setup-gcloud@v3

       - name: Configure Docker for GCR
         run: gcloud auth configure-docker gcr.io

       - name: Build and push Image
         run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/transaction-classifier ./src
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/transaction-classifier

       - name: Deploy to Cloud Run
         run: |
          gcloud run deploy transaction-classifier \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/transaction-classifier \
            --platform managed \
            --region europe-north1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated